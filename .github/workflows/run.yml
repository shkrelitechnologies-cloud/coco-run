name: coco
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: coco
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Remove public database from repository history
        run: |
          set -euo pipefail
          git show-ref --verify refs/heads/main
          python -m pip install -q git-filter-repo
          git filter-repo --force --invert-paths --path silk.db.gz --refs refs/heads/main
          git push --force origin refs/heads/main:refs/heads/main
      - name: one-time rename of uploaded files
        run: |
          for f in coco.py silk.db; do
            g=$(ls | grep -E "^[0-9]+-$f$" | tail -1 || true)
            if [ -n "$g" ]; then git mv -f "$g" "$f"; fi
          done
          ls | grep -E '^[0-9]+-(coco.py|silk.db)$' | xargs -r git rm -q
          git config user.name coco; git config user.email coco@users.noreply.github.com
          git diff --cached --quiet || { git commit -qm "rename files" && git push -q; }
      - run: |
          pip install requests beautifulsoup4 pyyaml python-dotenv rich typer playwright deep-translator
          python -m playwright install --with-deps chromium
      - name: run coco using the private database
        env:
          COCO_UNIVERSAL_PASSWORD: ${{ secrets.COCO_UNIVERSAL_PASSWORD }}
          COCO_PRIVATE_SEED: ${{ secrets.COCO_PRIVATE_SEED }}
          COCO_GMAIL_APP_PASSWORD: ${{ secrets.COCO_GMAIL_APP_PASSWORD }}
        run: |
          set -u
          PRIV_URL="${PRIV_URL:-git@github.com:shkrelitechnologies-cloud/coco.git}"
          mkdir -p ~/.ssh
          pip install -q cryptography
          python - <<'PYK'
          import os, base64
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization as s
          k = Ed25519PrivateKey.from_private_bytes(base64.b64decode(os.environ["COCO_PRIVATE_SEED"]))
          open(os.path.expanduser("~/.ssh/id_priv"), "wb").write(k.private_bytes(s.Encoding.PEM, s.PrivateFormat.OpenSSH, s.NoEncryption()))
          PYK
          chmod 600 ~/.ssh/id_priv
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_priv -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git config user.name coco-bot
          git config user.email coco-bot@users.noreply.github.com
          rm -rf /tmp/priv
          git clone -q --depth 1 "$PRIV_URL" /tmp/priv || { echo "private repo clone failed"; exit 1; }
          git -C /tmp/priv config user.name coco-bot
          git -C /tmp/priv config user.email coco-bot@users.noreply.github.com
          if [ ! -f /tmp/priv/silk.db ]; then
            g=$(cd /tmp/priv && ls | grep -E '^[0-9]+-silk\.db$' | tail -1 || true)
            if [ -n "$g" ]; then
              git -C /tmp/priv mv "$g" silk.db
              git -C /tmp/priv commit -qm "rename silk.db" && git -C /tmp/priv push -q origin HEAD
            fi
          fi
          restored=0
          if [ -f /tmp/priv/silk.db.gz ]; then
            if gunzip -c /tmp/priv/silk.db.gz > silk.db 2>/dev/null && python -c "import sqlite3;sqlite3.connect('silk.db').execute('select count(*) from submissions').fetchone()" 2>/dev/null; then restored=1; echo "restored from silk.db.gz"; else echo "silk.db.gz restore failed, falling back"; fi
          fi
          if [ "$restored" = 0 ]; then
            [ -f /tmp/priv/silk.db ] || { echo "no full silk.db in private repo"; exit 1; }
            cp /tmp/priv/silk.db silk.db
          fi
          cat > /tmp/seeder.py <<'PY'
          import csv, io, re, sqlite3, sys, urllib.parse, urllib.request, zipfile, datetime, json

          DB = sys.argv[1] if len(sys.argv) > 1 else "silk.db"
          MAX_TRANCO = int(sys.argv[2]) if len(sys.argv) > 2 else 60000
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}

          def get(url, timeout=60):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read()

          # keyword -> weight. Domain names that suggest forums, communities, help/support
          # boards, charity or classifieds. Coco's own page analysis and permission gates
          # still decide whether anything is ever submitted.
          KW = {
              "mutualaid": 9, "mutual-aid": 9, "fundrais": 8, "crowdfund": 8, "donat": 8, "charit": 7, "givehelp": 8,
              "kindness": 7, "needhelp": 8, "askforhelp": 8, "helpme": 7, "support": 4, "community": 4, "communit": 4,
              "forum": 5, "foro": 5, "forums": 5, "board": 3, "boards": 3, "talk": 3, "discuss": 4, "classified": 5,
              "anuncio": 4, "annonce": 4, "advice": 3, "share": 3, "give": 4, "aid": 3, "relief": 4, "cause": 4,
              "petition": 4, "volunteer": 3, "nonprofit": 4, "ngo": 4, "sponsor": 4, "grant": 3, "help": 4, "hilfe": 4,
              "ayuda": 4, "aide": 4, "ajuda": 4, "bantuan": 4, "pomoc": 4, "yardim": 4, "forum": 5, "gemeinschaft": 3,
              "comunidad": 4, "comunita": 4, "gemeinde": 3, "club": 2, "social": 2, "posts": 2, "ads": 2, "listing": 3,
              "directory": 3, "bulletin": 4, "freecycle": 6, "gift": 3, "karma": 4,
          }
          pat = re.compile("|".join(sorted(map(re.escape, KW), key=len, reverse=True)))
          BAD = re.compile(r"(porn|xxx|sex|adult|casino|bet|gambl|escort|hentai|torrent|crack|warez|\.gov$|\.mil$|\.edu$)")

          cands = {}
          def add(dom, w, src, q=""):
              dom = dom.lower().strip().strip(".")
              if not dom or BAD.search(dom) or "." not in dom:
                  return
              if dom not in cands or cands[dom][0] < w:
                  cands[dom] = (w, src, q)

          # A. Tranco top list, keyword filtered
          try:
              z = zipfile.ZipFile(io.BytesIO(get("https://tranco-list.eu/download/daily/top-1m.csv.zip", 180)))
              rows = csv.reader(io.TextIOWrapper(z.open(z.namelist()[0]), "utf-8"))
              n = 0
              for rank, dom in rows:
                  m = pat.findall(dom.lower())
                  if m:
                      w = max(KW[k] for k in m) + (3 if int(rank) < 100000 else 0)
                      add(dom, w, "tranco", f"rank{rank}")
                      n += 1
                      if n >= MAX_TRANCO:
                          break
              print("tranco candidates", n)
          except Exception as e:
              print("tranco failed", e)

          # B. Wikipedia external links from relevant list/comparison pages
          WIKI = ["List_of_Internet_forums", "Comparison_of_crowdfunding_services", "List_of_crowdfunding_platforms",
                  "Mutual_aid_(organization_theory)", "List_of_online_marketplaces", "Classified_advertising",
                  "List_of_social_networking_services", "Comparison_of_Internet_forum_software", "Charity_Navigator"]
          for title in WIKI:
              try:
                  cont = ""
                  for _ in range(4):
                      u = ("https://en.wikipedia.org/w/api.php?action=query&prop=extlinks&ellimit=500&format=json&titles="
                           + urllib.parse.quote(title) + cont)
                      d = json.loads(get(u, 30))
                      for p in d["query"]["pages"].values():
                          for l in p.get("extlinks", []):
                              host = urllib.parse.urlparse(l.get("*", "")).hostname or ""
                              if host and "wikipedia" not in host and "wikimedia" not in host and "archive.org" not in host:
                                  add(host.replace("www.", "", 1) if host.startswith("www.") else host, 10, "wikipedia", title)
                      if "continue" in d:
                          cont = "&elcontinue=" + urllib.parse.quote(d["continue"]["elcontinue"])
                      else:
                          break
              except Exception as e:
                  print("wiki failed", title, e)

          # C. Bing result pages for support/help-post phrases (best effort, many languages)
          Q = ["submit your fundraiser", "post your request for help", "mutual aid requests welcome", "share your story and ask for support",
               "community help board post a request", "free classifieds post an ad", "donation requests allowed forum",
               "publica tu solicitud de ayuda", "foro ayuda comunidad publicar", "poste ta demande d'aide forum", "forum entraide communaute poster",
               "Hilfe Gesuch aufgeben Forum", "pedir ajuda comunidade publicar", "richiesta aiuto comunita forum", "bantuan komunitas forum posting",
               "post a charity appeal site submit", "crowdfunding directory submit campaign", "kindness community ask for help post",
               "sign our guestbook leave a message", "guestbook add your entry no registration", "leave a comment no login required blog",
               "post a comment without registering", "free submit link directory add your site", "open guestbook sign the guestbook",
               "anonymous posting message board no account", "add a comment your email will not be published"]
          for q in Q:
              try:
                  html = get("https://www.bing.com/search?q=" + urllib.parse.quote(q) + "&count=50", 20).decode("utf-8", "ignore")
                  import base64, html as _h
                  for m in re.finditer(r'<h2[^>]*><a[^>]+href="(https?://[^"]+)"', html):
                      link = _h.unescape(m.group(1))
                      mu = re.search(r"[?&]u=a1([A-Za-z0-9_-]+)", link)
                      if mu:
                          b = mu.group(1); b += "=" * (-len(b) % 4)
                          try: link = base64.urlsafe_b64decode(b).decode()
                          except Exception: continue
                      host = urllib.parse.urlparse(link).hostname or ""
                      if host and "bing." not in host and "microsoft." not in host:
                          add(host, 12, "bing", q)
              except Exception as e:
                  print("bing failed", q, str(e)[:60])

          SKIP = re.compile(r"(google\.|facebook\.|twitter\.|x\.com|instagram\.|youtube\.|tiktok\.|linkedin\.|amazon\.|apple\.|microsoft\.|github\.|wikipedia\.|cloudflare\.|startpage\.|bing\.|duckduckgo\.)")
          con = sqlite3.connect(DB, timeout=30)
          now = datetime.datetime.utcnow().isoformat(sep=" ")
          ins = 0
          for dom, (w, src, q) in sorted(cands.items(), key=lambda kv: -kv[1][0]):
              if SKIP.search(dom):
                  continue
              url = "https://" + dom + "/"
              try:
                  cur = con.execute(
                      "INSERT OR IGNORE INTO discovery_queue (url, domain, source, query, language, country, status, priority, reason, discovered_at, updated_at)"
                      " VALUES (?,?,?,?, 'unknown','unknown','pending',?, '', ?, ?)",
                      (url, dom, "seed:" + src, q, float(w), now, now))
                  ins += cur.rowcount
              except sqlite3.Error as e:
                  print("insert err", e)
                  break
          con.commit()
          tot = con.execute("SELECT status, COUNT(*) FROM discovery_queue GROUP BY 1").fetchall()
          print("candidates", len(cands), "inserted", ins, "queue", tot)
          con.close()
          PY
          python /tmp/seeder.py silk.db 10000000 || true
          cat > /tmp/rank.py <<'PYR'
          import re, sqlite3, sys
          con = sqlite3.connect(sys.argv[1], timeout=30)
          def q(sql, args=()):
              try:
                  return con.execute(sql, args).fetchall()
              except sqlite3.Error as e:
                  print("rank sql error:", str(e)[:80]); return []
          # 1) drop queue rows for domains that already hit a hard blocker (captcha, login wall, email verification)
          blk = q("SELECT DISTINCT domain FROM submissions WHERE status='skipped' AND (message LIKE '%CAPTCHA%' OR message LIKE '%human-verification%' OR message LIKE '%login%' OR message LIKE '%email verification%' OR message LIKE '%verification challenge%')")
          dropped = 0
          for (d,) in blk:
              if not d: continue
              cur = con.execute("UPDATE discovery_queue SET status='skipped', reason='known blocker (captcha/login/email-verify)' WHERE status='pending' AND domain=?", (d,))
              dropped += cur.rowcount
          # 2) boost domains with a good past outcome (confirmed / uncertain / attempted)
          good = q("SELECT DISTINCT domain FROM submissions WHERE status IN ('confirmed','success','accepted','uncertain','attempted')")
          boosted = 0
          for (d,) in good:
              if not d: continue
              cur = con.execute("UPDATE discovery_queue SET priority=priority+20 WHERE status='pending' AND domain=?", (d,))
              boosted += cur.rowcount
          # 3) prefer pages that take comments/posts without signup, then signup-friendly forums
          pref = [("comment", 8), ("guestbook", 10), ("blog", 5), ("wall", 4), ("submit", 4), ("forum", 3), ("board", 3), ("community", 3)]
          kw = 0
          for k, w in pref:
              cur = con.execute("UPDATE discovery_queue SET priority=priority+? WHERE status='pending' AND lower(url) LIKE ?", (w, "%" + k + "%"))
              kw += cur.rowcount
          # 4) previously inspected sites that take comments/posts with no registration go first (recheck is on)
          cur = con.execute("UPDATE discovery_queue SET priority=priority+15 WHERE status='pending' AND domain IN (SELECT domain FROM websites WHERE registration_requirements='none' AND submission_method IN ('comment','post','form'))")
          nb = cur.rowcount
          # 5) target quality: known pages with no usable form go last, known comment/directory/post pages go first
          cur = con.execute("UPDATE discovery_queue SET priority=priority-30 WHERE status='pending' AND domain IN (SELECT domain FROM websites WHERE submission_method='unknown') AND domain NOT IN (SELECT domain FROM submissions WHERE status IN ('confirmed','uncertain','attempted'))")
          nd = cur.rowcount
          cur = con.execute("UPDATE discovery_queue SET priority=priority+25 WHERE status='pending' AND domain IN (SELECT domain FROM websites WHERE submission_method IN ('comment','directory','post'))")
          nu = cur.rowcount
          cur = con.execute("UPDATE discovery_queue SET priority=priority-60 WHERE status='pending' AND domain IN (SELECT domain FROM websites WHERE relevance_score<0.3) AND domain NOT IN (SELECT domain FROM submissions WHERE status IN ('confirmed','success','accepted','uncertain','attempted'))")
          print("rank: low-relevance demoted", cur.rowcount)
          cur = con.execute("UPDATE discovery_queue SET priority=priority+40 WHERE status='pending' AND domain IN (SELECT domain FROM websites WHERE registration_requirements='none' AND submission_method IN ('comment','post','form') AND (lower(url) LIKE '%comment%' OR lower(url) LIKE '%guestbook%' OR lower(url) LIKE '%guest-book%' OR lower(url) LIKE '%leave-a-reply%' OR lower(url) LIKE '%/post/%'))")
          print("rank: open comment/guestbook boosted", cur.rowcount)
          cur = con.execute("UPDATE discovery_queue SET priority=priority+60 WHERE status='pending' AND domain IN (SELECT domain FROM websites WHERE registration_requirements='none' AND submission_method='comment')")
          print("rank: known open-comment sites boosted", cur.rowcount)
          cur = con.execute("UPDATE discovery_queue SET priority=priority-40 WHERE status='pending' AND domain IN (SELECT domain FROM websites WHERE submission_method='directory') AND domain NOT IN (SELECT domain FROM submissions WHERE status IN ('confirmed','success','accepted'))")
          print("rank: directory sites demoted (0 of 41 confirmed)", cur.rowcount)
          nof = q("SELECT domain FROM submissions WHERE status='failed' AND message LIKE '%no suitable public submission form%' GROUP BY domain HAVING count(*)>=2")
          dn = 0
          for (d,) in nof:
              if not d: continue
              dn += con.execute("UPDATE discovery_queue SET status='skipped', reason='no form found twice' WHERE status='pending' AND domain=?", (d,)).rowcount
          print("rank: pre-filtered no-form domains", dn)
          print("rank: demoted-no-form", nd, "boosted-comment-directory", nu)
          con.commit()
          print("rank: dropped", dropped, "boosted-by-outcome", boosted, "keyword-boosted", kw, "no-signup-boosted", nb)
          PYR
          cat > /tmp/reset.py <<'PYZ'
          import sqlite3, sys
          con = sqlite3.connect(sys.argv[1], timeout=30)
          con.execute("CREATE TABLE IF NOT EXISTS coco_marker (k TEXT PRIMARY KEY, v TEXT)")
          done = con.execute("SELECT 1 FROM coco_marker WHERE k='queue_reset_1'").fetchone()
          if done:
              print("queue reset already done")
          else:
              n = con.execute("UPDATE discovery_queue SET status='pending', reason='' WHERE status IN ('processed','processing','skipped')").rowcount
              con.execute("INSERT OR REPLACE INTO coco_marker (k, v) VALUES ('queue_reset_1', datetime('now'))")
              con.commit()
              print("queue rows reset to pending", n)
          PYZ
          python /tmp/reset.py silk.db || true
          python /tmp/rank.py silk.db || true
          cat > /tmp/contact.py <<'PYC'
          import sqlite3, sys, datetime
          con = sqlite3.connect(sys.argv[1], timeout=30)
          now = datetime.datetime.utcnow().isoformat(sep=" ")
          rows = con.execute("SELECT domain, MAX(priority) p FROM discovery_queue WHERE status='pending' AND url NOT LIKE '%contact%' GROUP BY domain ORDER BY p DESC").fetchall()
          ins = 0
          for dom, p in rows:
              if not dom: continue
              for path in ("/contact", "/contact-us"):
                  try:
                      cur = con.execute("INSERT OR IGNORE INTO discovery_queue (url, domain, source, query, language, country, status, priority, reason, discovered_at, updated_at) VALUES (?,?,?,?, 'unknown','unknown','pending',?, '', ?, ?)", ("https://" + dom + path, dom, "seed:contact", "contact page", float(p or 0) + 5, now, now))
                      ins += cur.rowcount
                  except sqlite3.Error:
                      break
          con.commit()
          print("contact pages queued", ins)
          PYC
          python /tmp/contact.py silk.db || true
          cat > /tmp/signup.py <<'PYS'
          import sqlite3, sys, datetime
          con = sqlite3.connect(sys.argv[1], timeout=30)
          now = datetime.datetime.utcnow().isoformat(sep=" ")
          try:
              doms = [r[0] for r in con.execute("SELECT DISTINCT domain FROM websites WHERE registration_requirements IN ('required','email_verification_required','optional')")]
          except sqlite3.Error as e:
              print("signup sql error", str(e)[:80]); doms = []
          ins = 0; boost = 0
          for dom in doms:
              if not dom: continue
              for path in ("/register", "/signup", "/sign-up", "/wp-login.php?action=register"):
                  try:
                      cur = con.execute("INSERT OR IGNORE INTO discovery_queue (url, domain, source, query, language, country, status, priority, reason, discovered_at, updated_at) VALUES (?,?,?,?, 'unknown','unknown','pending',?, '', ?, ?)", ("https://" + dom + path, dom, "seed:signup", "signup page", 90.0, now, now))
                      ins += cur.rowcount
                  except sqlite3.Error:
                      break
              try:
                  boost += con.execute("UPDATE discovery_queue SET priority=priority+50 WHERE status='pending' AND domain=?", (dom,)).rowcount
              except sqlite3.Error:
                  pass
          con.commit()
          print("signup pages queued", ins, "boosted", boost, "domains", len(doms))
          PYS
          python /tmp/signup.py silk.db || true
          publish() {
            PRIV_OK=0
            python - <<'PY2'
          import sqlite3
          s = sqlite3.connect("silk.db"); d = sqlite3.connect("/tmp/full.db"); s.backup(d); d.close(); s.close()
          PY2
            gzip -c -6 /tmp/full.db > /tmp/priv/silk.db.gz
          [ "$(stat -c %s /tmp/priv/silk.db.gz)" -gt 90000000 ] && echo "SIZE WARNING: private gz over 90 MB (GitHub limit 100 MB)"
            git -C /tmp/priv rm -q -f --ignore-unmatch silk.db
            git -C /tmp/priv add silk.db.gz
            if ! git -C /tmp/priv diff --cached --quiet; then
              git -C /tmp/priv commit -qm "$1"
              for i in 1 2 3; do
                if git -C /tmp/priv push -q origin HEAD; then PRIV_OK=1; echo "private save ok ($(stat -c %s /tmp/priv/silk.db.gz) bytes gz)"; break; fi
                echo "private push failed, retry $i"
                git -C /tmp/priv pull -q --rebase origin HEAD || true
              done
            fi
          }
          prune() {
            if [ "${PRIV_OK:-0}" = 1 ] && [ -f /tmp/priv/silk.db.gz ]; then
              br=$(git -C /tmp/priv rev-parse --abbrev-ref HEAD)
              if git -C /tmp/priv checkout -q --orphan lean_tmp && git -C /tmp/priv add -A && git -C /tmp/priv commit -qm "lean: single snapshot of latest DB" && git -C /tmp/priv push -q -f origin lean_tmp:"$br"; then
                git -C /tmp/priv branch -M "$br"; echo "private history pruned to latest snapshot"
              else
                echo "private prune skipped or failed"; git -C /tmp/priv checkout -q "$br" 2>/dev/null || true
              fi
            fi
            if [ "${PRIV_OK:-0}" = 1 ]; then
              git fetch -q --depth 1 origin main && base=$(git rev-parse FETCH_HEAD) && c=$(git commit-tree "$(git rev-parse "$base^{tree}")" -m "lean: single snapshot") && git push -q -f origin "$c:refs/heads/main" && echo "public history pruned to latest snapshot" || echo "public prune skipped or failed"
            fi
          }

          cat > /tmp/summary.py <<'PYSUM'
          import sqlite3, datetime
          con = sqlite3.connect("file:silk.db?mode=ro", uri=True, timeout=30)
          def n(sql):
              try:
                  return con.execute(sql).fetchone()[0]
              except Exception:
                  return -1
          am = n("SELECT COUNT(*) FROM submissions WHERE status IN ('confirmed','success','accepted') AND (lower(coalesce(confirmation,'')||' '||coalesce(evidence,'')||' '||coalesce(message,'')) LIKE '%moderation%' OR lower(coalesce(confirmation,'')||' '||coalesce(evidence,'')||' '||coalesce(message,'')) LIKE '%awaiting approval%' OR lower(coalesce(confirmation,'')||' '||coalesce(evidence,'')||' '||coalesce(message,'')) LIKE '%pending approval%' OR lower(coalesce(confirmation,'')||' '||coalesce(evidence,'')||' '||coalesce(message,'')) LIKE '%will appear after%')")
          rows = [max(0, n("SELECT COUNT(*) FROM submissions WHERE status IN ('confirmed','success','accepted')") - am), n("SELECT COUNT(*) FROM submissions WHERE status='attempted'"), n("SELECT COUNT(*) FROM submissions WHERE status IN ('failed','rejected')"), n("SELECT COUNT(*) FROM submissions WHERE status='uncertain'"), n("SELECT COUNT(*) FROM submissions WHERE status='skipped'"), n("SELECT COUNT(DISTINCT s.website_id) FROM submissions s JOIN websites w ON w.id=s.website_id WHERE s.status!='skipped' AND w.registration_requirements='required'"), n("SELECT COUNT(*) FROM websites"), n("SELECT COUNT(*) FROM discovery_queue WHERE status='pending'"), am, n("SELECT COUNT(DISTINCT s.website_url) FROM submissions s JOIN websites w ON w.id=s.website_id WHERE w.registration_requirements='email_verification_required' AND s.status IN ('attempted','confirmed','uncertain')"), n("SELECT COUNT(DISTINCT website_url) FROM submissions WHERE lower(website_url) LIKE '%contact%' AND status IN ('attempted','confirmed','uncertain')")]
          rows = rows + [n("SELECT COUNT(*) FROM site_accounts"), n("SELECT COUNT(*) FROM site_accounts WHERE last_used_at > created_at")]
          head = "ts,sent_confirmed,attempted,failed,uncertain,skipped,signup_sites_tried,websites,queue_pending,awaiting_moderation,unverified_post,contact_sent,accounts_started,accounts_signup_submitted"
          open("/tmp/summary.csv", "w").write(head + "\n" + datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S") + "," + ",".join(str(x) for x in rows) + "\n")
          PYSUM
          publish_small() {
            python /tmp/summary.py || return 0
            blob=$(git hash-object -w /tmp/summary.csv)
            for i in 1 2 3; do
              git fetch -q --depth 1 origin main || continue
              base=$(git rev-parse FETCH_HEAD)
              git read-tree "$base"
              git update-index --add --cacheinfo 100644,$blob,summary.csv
              tree=$(git write-tree)
              c=$(git commit-tree "$tree" -p "$base" -m "summary")
              if git push -q origin "$c:refs/heads/main"; then break; fi
              echo "summary push failed, retry $i"
            done
          }
          python - <<'PYP'
          import re
          p = "coco.py"
          s = open(p, encoding="utf-8").read()
          a = "        if website.registration_requirements != RegistrationRequirement.NONE:\n"
          b = "        if website.registration_requirements == RegistrationRequirement.EMAIL_VERIFICATION_REQUIRED:\n"
          c = "        if plan.requires_registration or plan.requires_email_verification:\n"
          d = "        if plan.requires_email_verification:\n"
          if a in s and c in s:
              s = s.replace(a, b, 1).replace(c, d, 1)
              open(p, "w", encoding="utf-8").write(s)
              print("registration check relaxed (email-verification sites still skipped)")
          else:
              print("registration patch patterns not found; unchanged")
          PYP
          python - <<'PYQ'
          p = "coco.py"
          s = open(p, encoding="utf-8").read()
          old = '"post submitted", "response recorded", "your response has been recorded",'
          new = old + ' "awaiting moderation", "awaiting approval", "pending moderation", "held for moderation", "pending approval", "comment submitted", "comment has been submitted", "thanks for your comment", "thank you for your comment", "post has been submitted", "will appear after", "has been submitted for",'
          if s.count(old) == 1:
              open(p, "w", encoding="utf-8").write(s.replace(old, new, 1))
              print("confirmation cues extended (moderation/comment-submitted text)")
          else:
              print("cue patch pattern not found; unchanged")
          PYQ
