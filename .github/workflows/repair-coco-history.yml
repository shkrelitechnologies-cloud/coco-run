name: Preserve COCO repository history
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coco-history-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace destructive history pruning with a no-op
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/run.yml')
          source = path.read_text(encoding='utf-8')
          start_pattern = re.compile(r'(?m)^(?P<indent>[ \\t]*)prune\\(\\)[ \\t]*\\{[ \\t]*\\r?\\n')
          match = start_pattern.search(source)
          if not match:
              raise SystemExit('Expected prune() function not found; refusing to modify an unexpected workflow')
          indent = match.group('indent')
          end_pattern = re.compile(r'(?m)^' + re.escape(indent) + r'\\}[ \\t]*\\r?$')
          end = end_pattern.search(source, match.end())
          if not end:
              raise SystemExit('Could not find the prune() function boundary; refusing to modify the workflow')
          function_end = end.end()
          if function_end < len(source) and source[function_end:function_end + 1] == '\\n':
              function_end += 1
          block = source[match.start():function_end]
          if 'git push -q -f origin' not in block:
              raise SystemExit('Expected force-push history rewrite not found in prune(); refusing to alter workflow')
          replacement = indent + 'prune() {\\n' + indent + '  echo "history pruning disabled; preserve full commit history"\\n' + indent + '}\\n'
          updated = source[:match.start()] + replacement + source[function_end:]
          if 'git push -q -f origin' in updated:
              raise SystemExit('Force-push command remains in workflow; refusing to commit')
          path.write_text(updated, encoding='utf-8')
          print('Replaced the history-rewriting prune function with a safe no-op.')
          PY
      - name: Commit the history-preserving fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/run.yml
          if git diff --cached --quiet; then
            echo 'No change was needed; the history-pruning function is already safe.'
            exit 0
          fi
          git commit -m "Disable destructive COCO history pruning"
          git push origin HEAD:main
