name: Preserve COCO repository history
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coco-history-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace destructive history pruning with a no-op
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/run.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          starts = [i for i, line in enumerate(lines) if line.lstrip(' \\t').startswith('prune() {')]
          if len(starts) != 1:
              raise SystemExit(f'Expected one prune() function, found {len(starts)}; refusing to modify workflow')
          start = starts[0]
          indent = lines[start][:len(lines[start]) - len(lines[start].lstrip(' \\t'))]
          end = None
          for i in range(start + 1, len(lines)):
              line_indent = lines[i][:len(lines[i]) - len(lines[i].lstrip(' \\t'))]
              if lines[i].strip() == '}' and line_indent == indent:
                  end = i
                  break
          if end is None:
              raise SystemExit('Could not find prune() boundary; refusing to modify workflow')
          block = ''.join(lines[start:end + 1])
          if 'git push -q -f origin' not in block:
              raise SystemExit('Expected force-push history rewrite not found in prune(); refusing to alter workflow')
          newline = '\\r\\n' if lines[start].endswith('\\r\\n') else '\\n'
          replacement = [
              indent + 'prune() {' + newline,
              indent + '  echo "history pruning disabled; preserve full commit history"' + newline,
              indent + '}' + newline,
          ]
          updated = ''.join(lines[:start] + replacement + lines[end + 1:])
          if 'git push -q -f origin' in updated:
              raise SystemExit('Force-push command remains in workflow; refusing to commit')
          path.write_text(updated, encoding='utf-8')
          print('Replaced the history-rewriting prune function with a safe no-op.')
          PY
      - name: Commit the history-preserving fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/run.yml
          if git diff --cached --quiet; then
            echo 'No change was needed; the history-pruning function is already safe.'
            exit 0
          fi
          git commit -m "Disable destructive COCO history pruning"
          git push origin HEAD:main
